<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Tadabbur — Understand the Quran as you read</title>
  <meta name="description" content="Read the Quran word by word in Urdu and English, with its revelation context, from cited authentic sources.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;500&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f6b5c">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tadabbur">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="hero wrap">
      <h1 data-i18n-html="home.heroHtml"></h1>
      <p class="lead" data-i18n="home.lead"></p>
      <form class="search-box card hero-search" action="search.html" role="search">
        <input type="search" name="q" autocomplete="off" data-i18n-placeholder="home.searchPlaceholder" data-i18n-aria-label="nav.search" dir="auto">
        <button class="btn primary" type="submit" data-i18n="common.search"></button>
      </form>
      <div id="continue"></div>
      <div class="hero-ayah card" id="hero-ayah" translate="no">
        <div class="skeleton" data-i18n="common.loading"></div>
      </div>
    </section>

    <section class="wrap" id="journey">
      <div class="section-h">
        <div>
          <h2 data-i18n="home.journeyTitle"></h2>
          <p data-i18n="home.journeyLead"></p>
        </div>
      </div>
      <div class="card journey">
        <div id="journey-bars"></div>
        <div class="journey-axis"><span data-i18n="home.axisFirst"></span><span data-i18n="home.axisLast"></span></div>
        <div class="journey-legend">
          <span class="chip makkah"><span class="dot"></span><span data-i18n="home.legendMakki"></span></span>
          <span class="chip madinah"><span class="dot"></span><span data-i18n="home.legendMadani"></span></span>
          <span class="tiny" id="journey-src"></span>
        </div>
      </div>
    </section>

    <section class="wrap" id="surahs">
      <div class="section-h">
        <div>
          <h2 data-i18n="home.surahsTitle"></h2>
          <p id="surah-count"></p>
        </div>
        <div class="controls">
          <div class="seg" id="order-seg">
            <button data-v="mushaf" class="on" data-i18n="home.orderMushaf"></button>
            <button data-v="revelation" data-i18n="home.orderRevelation"></button>
          </div>
          <div class="seg" id="place-seg">
            <button data-v="all" class="on" data-i18n="home.filterAll"></button>
            <button data-v="makkah" data-i18n="common.makki"></button>
            <button data-v="madinah" data-i18n="common.madani"></button>
          </div>
          <input type="search" id="q" data-i18n-placeholder="home.filterPlaceholder" data-i18n-aria-label="home.filterPlaceholder">
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="wrap" id="offline">
      <div class="section-h"><div><h2 data-i18n="pwa.offlineTitle"></h2></div></div>
      <div class="card" style="padding:18px" id="offline-panel"></div>
    </section>
  </main>
  <script type="module" src="js/home.js"></script>
</body>
</html>
