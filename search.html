<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Search the Quran — Tadabbur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;500&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f6b5c">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tadabbur">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <section class="hero" style="text-align:left;padding-bottom:6px">
      <h1 data-i18n-html="search.titleHtml"></h1>
      <p class="lead" style="margin:0" data-i18n-html="search.leadHtml"></p>
    </section>
    <form class="search-box card" id="form" role="search">
      <input type="search" id="q" name="q" autocomplete="off" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="nav.search" dir="auto">
      <button class="btn primary" type="submit" data-i18n="common.search"></button>
    </form>
    <div class="search-scope" id="scope"></div>
    <div id="results"></div>
  </main>
  <script type="module" src="js/search.js"></script>
</body>
</html>
