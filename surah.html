<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Surah — Tadabbur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;500&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f6b5c">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tadabbur">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <section class="gate" id="gate"><div class="skeleton" data-i18n="surah.loading"></div></section>

    <div class="toolbar card" id="toolbar">
      <button class="btn primary" id="play-all"></button>
      <div class="seg" id="script-seg" data-i18n-title="surah.scriptLabel">
        <button data-v="indopak" data-i18n="surah.indopak"></button>
        <button data-v="uthmani" data-i18n="surah.uthmani"></button>
        <button data-v="tajweed" data-i18n="surah.tajweed"></button>
      </div>
      <div class="seg" id="wbw-seg" data-i18n-title="surah.wbwLabel">
        <button data-v="off" data-i18n="surah.noWbw"></button>
        <button data-v="ur" data-i18n="lang.ur"></button>
        <button data-v="en" data-i18n="lang.en"></button>
        <button data-v="both" data-i18n="surah.both"></button>
      </div>
      <span class="grow"></span>
      <button class="btn" id="open-tr"><span data-i18n="surah.translations"></span> <span class="chip" id="tr-count"></span></button>
      <button class="btn" id="open-settings" data-i18n-aria-label="surah.settingsAria"></button>
    </div>

    <div id="tajweed-key" class="card tajweed-key hidden"></div>
    <div id="reader" translate="no"></div>
    <nav class="pager" id="pager"></nav>
  </main>

  <!-- word popover -->
  <div class="pop card" id="pop" role="dialog" data-i18n-aria-label="surah.wordDialog"></div>

  <!-- drawers -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-h"><h3 id="drawer-title"></h3><button class="icon-btn" id="drawer-close" data-i18n-aria-label="common.close"></button></div>
    <div class="drawer-b" id="drawer-body"></div>
  </aside>

  <audio id="audio" preload="none"></audio>
  <script type="module" src="js/surah.js"></script>
</body>
</html>
